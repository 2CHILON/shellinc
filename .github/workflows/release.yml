name: Release

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'installer/**'

permissions:
  contents: read

env:
  VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'dev' }}

jobs:
  verify:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check that the tag matches the CMake version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          base="${tag%%-*}"
          cmake_version="$(sed -n 's/^project(shellinc VERSION \([0-9][0-9.]*\).*/\1/p' CMakeLists.txt)"
          echo "tag=$tag  base=$base  CMakeLists.txt=$cmake_version"
          if ! echo "$base" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::the tag must look like vMAJOR.MINOR.PATCH (optionally with a -suffix)"
            exit 1
          fi
          if [ "$base" != "$cmake_version" ]; then
            echo "::error::tag version $base does not match the version $cmake_version in CMakeLists.txt"
            exit 1
          fi

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXE_LINKER_FLAGS=-static
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Package
        run: |
          name="shellinc-${VERSION}-linux-x86_64"
          mkdir "$name"
          strip build/shellinc
          cp build/shellinc LICENSE README.md "$name/"
          cmake -E tar czf "$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: shellinc-*.tar.gz

  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXE_LINKER_FLAGS=-static
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Package
        run: |
          name="shellinc-${VERSION}-windows-x86_64"
          mkdir "$name"
          strip build/shellinc.exe
          cp build/shellinc.exe LICENSE README.md "$name/"
          cmake -E tar cf "$name.zip" --format=zip "$name"

      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $tag = $env:VERSION
          if ($tag -like 'v*') {
            $display = $tag.Substring(1)
            $numeric = ($display -split '-')[0] + '.0'
          } else {
            $display = 'dev'
            $numeric = '0.0.0.0'
          }
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "/DAppVersion=$display" "/DNumericVersion=$numeric" "/DOutputName=shellinc-$tag-windows-x86_64-setup" "/DRepoUrl=https://github.com/$env:GITHUB_REPOSITORY" installer\shellinc.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }
          Copy-Item "installer\output\shellinc-$tag-windows-x86_64-setup.exe" .

      - name: Test installer
        shell: pwsh
        run: |
          $setup = (Get-ChildItem "shellinc-*-setup.exe" | Select-Object -First 1).FullName
          $dir = Join-Path $env:RUNNER_TEMP 'shellinc-install'

          $p = Start-Process -FilePath $setup -Wait -PassThru -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=$dir", '/TASKS=addtopath'
          if ($p.ExitCode -ne 0) { throw "installer exited with code $($p.ExitCode)" }

          $exe = Join-Path $dir 'shellinc.exe'
          if (-not (Test-Path $exe)) { throw 'shellinc.exe was not installed' }

          $out = "echo installed`nexit" | & $exe
          if (($out -join "`n") -notmatch 'installed') { throw "the installed shell did not work: $out" }

          $userPath = [Environment]::GetEnvironmentVariable('Path', 'User')
          if (-not ($userPath -and $userPath.Contains($dir))) { throw 'the install folder was not added to the user PATH' }

          Start-Process -FilePath (Join-Path $dir 'unins000.exe') -Wait -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART'
          for ($i = 0; $i -lt 30 -and (Test-Path $exe); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path $exe) { throw 'the uninstaller did not remove shellinc.exe' }

          for ($i = 0; $i -lt 30; $i++) {
            $userPath = [Environment]::GetEnvironmentVariable('Path', 'User')
            if (-not ($userPath -and $userPath.Contains($dir))) { break }
            Start-Sleep -Seconds 1
          }
          if ($userPath -and $userPath.Contains($dir)) { throw 'the uninstaller did not remove the PATH entry' }

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            shellinc-*.zip
            shellinc-*-setup.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [verify, build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: |
          sha256sum shellinc-* > SHA256SUMS
          cat SHA256SUMS
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          case "$GITHUB_REF_NAME" in
            *-*) flags="--prerelease" ;;
          esac
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            $flags